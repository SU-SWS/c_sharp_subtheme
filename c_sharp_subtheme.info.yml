name: c-ShARP Subtheme
type: theme
description: 'c-ShARP Subtheme.'
package: Stanford
version: 2.0.1
core_version_requirement: ^11.2 || ^12
base theme: stanford_basic
libraries:
  - c_sharp_subtheme/allpages

regions:
  page_top: 'Page top'
  header: Header
  search: Search
  menu: Menu
  help: Help
  content: Content
  footer: Footer
  page_bottom: 'Page bottom'

ckeditor5-stylesheets:
  - dist/css/ckeditor5.css

libraries-override:
  stanford_basic/algolia-search:
    js:
      algolia-search/dist/islands/algolia-search.island.js: algolia-search/dist/islands/algolia-search.island.js
    dependencies:
      - core/drupalSettings
  stanford_basic/decoupled_menu:
    js:
      decoupled-menu/dist/islands/main-menu.island.js: decoupled-menu/dist/islands/main-menu.island.umd.js
